<!-- ------------bmi generater------- -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator with Weight Guide</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      border: 2px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    input {
      margin: 10px;
      padding: 10px;
      width: 80%;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      border: none;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #bmiResult {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }

    .weight-guide {
      margin-top: 20px;
      padding: 10px;
      background-color: #e7e7e7;
      border-radius: 5px;
    }

    .guide-item {
      margin: 10px 0;
    }

    .underweight {
      color: #ff4d4d;
    }

    .normal {
      color: #28a745;
    }

    .overweight {
      color: #ffa500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BMI Calculator</h1>
    <form id="bmiForm">
      <label for="weight">Enter your weight (kg):</label><br>
      <input type="number" id="weight" placeholder="Enter weight" required><br>
      <label for="height">Enter your height (m):</label><br>
      <input type="number" id="height" placeholder="Enter height in meters" step="0.01" required><br>
      <button type="submit">Calculate BMI</button>
    </form>
    <div id="bmiResult"></div>
    <div class="weight-guide">
      <h3>Weight Guide</h3>
      <div class="guide-item underweight">Underweight: BMI less than 18.6</div>
      <div class="guide-item normal">Normal: BMI between 18.6 and 24.9</div>
      <div class="guide-item overweight">Overweight: BMI greater than 24.9</div>
    </div>
  </div>

  <script>
    document.getElementById('bmiForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const weight = document.getElementById('weight').value;
      const height = document.getElementById('height').value;

      if (weight > 0 && height > 0) {
        const bmi = (weight / (height * height)).toFixed(2);
        let message;

        if (bmi < 18.6) {
          message = `Your BMI is ${bmi}. You are underweight.`;
        } else if (bmi >= 18.6 && bmi <= 24.9) {
          message = `Your BMI is ${bmi}. You are in the normal range.`;
        } else {
          message = `Your BMI is ${bmi}. You are overweight.`;
        }

        document.getElementById('bmiResult').innerHTML = message;
      } else {
        document.getElementById('bmiResult').innerHTML = "Please enter valid values for both weight and height.";
      }
    });
  </script>
</body>
</html>
